<style>

.ascii-row {
    font-family:
        "Cascadia Mono",
        "Consolas",
        "Liberation Mono",
        monospace;

    font-size: 8px;

    fill: #d0d7de;

    white-space: pre;

    opacity: 0;

    animation:
        typeRow
        0.45s
        ease-out
        forwards;
}

@keyframes typeRow {

    from {
        opacity: 0;
        transform: translateX(-8px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }

}

</style>

